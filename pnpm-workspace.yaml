packages:
  - 'apps/*'

overrides:
  brace-expansion@1: ^1.1.17
  brace-expansion@2: ^2.1.3
  uuid@<11.1.1: ^11.1.1
  # @adonisjs/core@7.3.5 depends on @adonisjs/ace ^14.1.0, which resolves to
  # the buggy 14.1.0 by default. On Node 24.20+, ace's FsLoader command scan
  # throws "Invalid command exported... Invalid URL" while validating
  # apps/api/commands/*.ts metadata (its jsonschema-based validator resolves
  # schema $refs against an implicit base URL that 24.20.0's stricter URL
  # parsing rejects - adonisjs/ace#169), which crashes apps/api's test
  # bootstrap (tests/bootstrap.ts's testUtils.db().migrate() boots the ace
  # Kernel, which scans every command including commands/demo_seed.ts).
  # Fixed upstream in 14.1.1 (adonisjs/ace#170, which gives the schema a
  # real $id) - drop this override once @adonisjs/core's own dependency
  # floor moves past that.
  '@adonisjs/ace': 14.1.1

allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  '@tailwindcss/oxide': true
